name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 契约闸门与阶段回归（零三方依赖，纯标准库）
        run: |
          python tests/validate_contract.py
          python tests/test_stage1_regression.py
          python tests/test_stage2_regression.py
          python tests/test_stage3_regression.py
          python tests/test_stage4_regression.py
          python tests/test_stage5_regression.py
          python tests/test_stage6_regression.py
          python tests/check_knowledge.py
      - name: 确认无 lock 漂移（校验不应改动 skills-lock.json）
        run: git diff --exit-code -- skills-lock.json