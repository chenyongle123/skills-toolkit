name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 2026-11-01：原为单个 run 块内串跑 8 条命令，失败时整块只报 exit 1，
      # 无法定位是哪一条（CI #1/#2/#3 均因此查不到具体失败命令）。
      # 拆为独立 step，使失败命令在 Actions 页面直接可见。
      - name: Python 3.11 兼容扫描（本机 3.13 跑不出、CI 3.11 会 SyntaxError）
        run: python tests/check_py311_compat.py
      - name: 契约闸门（C1–C13）
        run: python tests/validate_contract.py
      - name: 阶段 1 回归
        run: python tests/test_stage1_regression.py
      - name: 阶段 2 回归
        run: python tests/test_stage2_regression.py
      - name: 阶段 3 回归
        run: python tests/test_stage3_regression.py
      - name: 阶段 4 回归
        run: python tests/test_stage4_regression.py
      - name: 阶段 5 回归
        run: python tests/test_stage5_regression.py
      - name: 阶段 6 回归
        run: python tests/test_stage6_regression.py
      - name: 素材母库检查
        run: python tests/check_knowledge.py
      - name: 提交红线机检（扫全量被跟踪文件，防真实指代入库）
        run: python tests/check_redline_scan.py
      - name: 确认无 lock 漂移（校验不应改动 skills-lock.json）
        run: git diff --exit-code -- skills-lock.json
